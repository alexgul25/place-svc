# CI для Place Service: линтеры, поиск уязвимостей, unit-, интеграционные и E2E-тесты, проверка Docker-образа.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Ручной запуск из вкладки Actions.
  workflow_dispatch:
  # Еженедельный прогон: новые уязвимости публикуются и без изменений в коде.
  schedule:
    - cron: "0 5 * * 1" # понедельник, 08:00 МСК

# GITHUB_TOKEN получает только право читать код.
permissions:
  contents: read

# Новый пуш в PR отменяет устаревший прогон; прогоны в main не отменяются.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Версия Go берётся из директивы go в go.mod, кэш модулей - по go.sum.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Падает, если go.mod или go.sum не приведены в порядок через go mod tidy.
      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      # Набор линтеров и форматтеров описан в .golangci.yml (go vet входит в него).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14

  vulncheck:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Ищет известные уязвимости в зависимостях и стандартной библиотеке
      # и сообщает только о тех, до которых реально доходит код сервиса.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Отдельная проверка, что собираются все пакеты, включая оба бинарника из cmd/.
      - name: Build
        run: go build ./...

      # Быстрая проверка без PostgreSQL, Redis и Kafka; -race ловит гонки данных.
      - name: Test
        run: go test -race ./...

  integration:
    name: Integration tests (${{ matrix.versions }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Падение на одних версиях серверов не отменяет проверку на других.
      fail-fast: false
      matrix:
        include:
          # Самые старые поддерживаемые версии. Kafka - та же, что в date-wishlist-hub-deploy.
          - versions: oldest
            postgres: "15"
            redis: "7.2"
            kafka: "4.0.0"
          # Самые новые.
          - versions: newest
            postgres: "18"
            redis: "8.10"
            kafka: "4.3.1"
    services:
      # GitHub запускает контейнеры и ждёт, пока их health-check не станет успешным.
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: place_svc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:${{ matrix.redis }}-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      # Один узел KRaft, как в date-wishlist-hub-deploy. Топики тесты создают сами.
      kafka:
        image: apache/kafka:${{ matrix.kafka }}
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s
          --health-timeout 20s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/place_svc_test?sslmode=disable
      TEST_REDIS_ADDR: localhost:6379
      TEST_KAFKA_BROKERS: localhost:9092
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Все тесты, включая интеграционные и E2E. Данные о покрытии пишут и тесты,
      # и запущенные в E2E-тестах бинарники - в общий каталог covdata.
      # -coverpkg=./... считает покрытие по всем пакетам, поэтому итог - покрытие всего сервиса.
      - name: Test
        run: |
          mkdir -p covdata
          go test -race -tags=integration -covermode=atomic -coverpkg=./... ./... -args -test.gocoverdir="$PWD/covdata"

      # Итог покрытия попадает на страницу прогона (Summary), HTML-отчёт - в артефакт.
      # Отчёт один: с самых новых версий серверов.
      - name: Coverage report
        if: matrix.versions == 'newest'
        run: |
          go tool covdata textfmt -i=covdata -o coverage.out
          go tool cover -html=coverage.out -o coverage.html
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
          {
            echo "### Покрытие тестами: ${total}"
            echo
            echo "<details><summary>Покрытие по функциям</summary>"
            echo
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: matrix.versions == 'newest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.out
            coverage.html
          retention-days: 14

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Сервису для запуска нужны все три сервера, мигратору - только PostgreSQL.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: place_svc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:8.10-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      kafka:
        image: apache/kafka:4.3.1
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s
          --health-timeout 20s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7

      # Сборка образа проверяет и Dockerfile, и то, что код собирается в нём.
      - name: Build image
        run: docker build -t place-svc:ci .

      # Тот же скрипт, что и make docker-smoke: миграции, запуск, health-check, остановка.
      - name: Smoke test
        run: bash scripts/docker-smoke.sh place-svc:ci
